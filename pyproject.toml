[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-mip-platform"
version = "0.1.0"
description = "Educational AI/ML inference-platform control plane integrating MLflow, KServe, and LiteLLM."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Ha Duc Dung" }
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.12",
  "mypy>=1.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
